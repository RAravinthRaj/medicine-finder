{% extends "base.html" %}

{% block title %}Medicine Finder - Search{% endblock %}

{% block extra_head %}
<style>
  .spinner {
    display: none;
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-top: 3px solid white;
    border-radius: 999px;
    width: 20px;
    height: 20px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>
{% endblock %}

{% block content %}
<section class="animate-rise">
  <div class="mb-8 flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
    <div>
      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-pine">Medicine search</p>
      <h1 class="mt-3 text-5xl font-extrabold tracking-tight text-ink">Search medicines by name, price, and stock.</h1>
    </div>
    <div class="rounded-2xl border border-blue-100 bg-blue-50 px-5 py-4 text-sm text-pine shadow-soft">
      Results update instantly.
    </div>
  </div>

  <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-soft">
    <form id="search-form" class="grid gap-5 lg:grid-cols-[2fr_1fr_1fr_1fr_auto]">
      <div class="lg:col-span-1">
        <label for="medicine_name" class="mb-2 block text-sm font-bold uppercase tracking-[0.12em] text-slate-500">Medicine</label>
        <input
          type="text"
          id="medicine_name"
          name="medicine_name"
          placeholder="Paracetamol, Cetirizine..."
          class="w-full rounded-xl border border-slate-200 bg-white px-4 py-4 outline-none transition focus:border-pine focus:ring-4 focus:ring-blue-100"
        />
      </div>
      <div>
        <label for="min_price" class="mb-2 block text-sm font-bold uppercase tracking-[0.12em] text-slate-500">Min Price</label>
        <input
          type="number"
          id="min_price"
          name="min_price"
          min="0"
          step="0.01"
          placeholder="0.00"
          class="w-full rounded-xl border border-slate-200 bg-white px-4 py-4 outline-none transition focus:border-pine focus:ring-4 focus:ring-blue-100"
        />
      </div>
      <div>
        <label for="max_price" class="mb-2 block text-sm font-bold uppercase tracking-[0.12em] text-slate-500">Max Price</label>
        <input
          type="number"
          id="max_price"
          name="max_price"
          min="0"
          step="0.01"
          placeholder="100.00"
          class="w-full rounded-xl border border-slate-200 bg-white px-4 py-4 outline-none transition focus:border-pine focus:ring-4 focus:ring-blue-100"
        />
      </div>
      <div>
        <label for="min_stock" class="mb-2 block text-sm font-bold uppercase tracking-[0.12em] text-slate-500">Min Stock</label>
        <input
          type="number"
          id="min_stock"
          name="min_stock"
          min="0"
          placeholder="0"
          class="w-full rounded-xl border border-slate-200 bg-white px-4 py-4 outline-none transition focus:border-pine focus:ring-4 focus:ring-blue-100"
        />
      </div>
      <div class="flex items-end">
        <button
          type="submit"
          class="flex w-full items-center justify-center rounded-xl bg-pine px-6 py-4 font-bold text-white shadow-soft transition hover:bg-pine/90"
        >
          <span id="search-btn-text">Search</span>
          <span id="search-spinner" class="spinner ml-2"></span>
        </button>
      </div>
    </form>
  </div>

  <div id="results" class="mt-8 grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3"></div>
  <div id="pagination" class="mt-8 flex justify-center gap-3"></div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  function updateCart() {
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartCount();
  }

  function addToCart(medicine) {
    const existingItem = cart.find((item) => item.id === medicine.id);
    if (existingItem) {
      if (existingItem.quantity < medicine.quantity) {
        existingItem.quantity += 1;
        showToast(`${medicine.name} quantity updated in cart!`, "success");
      } else {
        showToast(`Cannot add more ${medicine.name}. Only ${medicine.quantity} in stock.`, "error");
        return;
      }
    } else {
      cart.push({
        id: medicine.id,
        name: medicine.name,
        price: medicine.price,
        stock: medicine.quantity,
        quantity: 1,
      });
      showToast(`${medicine.name} added to cart!`, "success");
    }
    updateCart();
  }

  async function searchMedicines(page = 1) {
    const medicineName = document.getElementById("medicine_name").value;
    const minPrice = document.getElementById("min_price").value;
    const maxPrice = document.getElementById("max_price").value;
    const minStock = document.getElementById("min_stock").value;
    const searchBtnText = document.getElementById("search-btn-text");
    const searchSpinner = document.getElementById("search-spinner");
    searchBtnText.classList.add("hidden");
    searchSpinner.style.display = "block";

    try {
      const response = await fetch('{{ url_for("medicine.search_medicine") }}', {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `medicine_name=${encodeURIComponent(medicineName)}&min_price=${minPrice}&max_price=${maxPrice}&min_stock=${minStock}&page=${page}`,
      });
      const data = await response.json();
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      if (data.results.length === 0) {
        resultsDiv.innerHTML = `
          <div class="col-span-full rounded-3xl border border-slate-200 bg-white p-10 text-center shadow-soft">
            <p class="text-3xl font-bold text-ink">No medicines found</p>
            <p class="mt-3 text-slate-600">Try a different search.</p>
          </div>
        `;
      } else {
        data.results.forEach((medicine) => {
          const card = document.createElement("div");
          const stockTone = medicine.quantity <= 5 ? "text-coral" : "text-pine";
          card.className = "rounded-3xl border border-slate-200 bg-white p-6 shadow-soft transition hover:-translate-y-1";
          card.innerHTML = `
            <div class="flex items-start justify-between gap-4">
              <div>
                <p class="text-sm font-semibold uppercase tracking-[0.12em] text-slate-500">Medicine</p>
                <h3 class="mt-3 text-2xl font-bold text-ink">${medicine.name}</h3>
              </div>
              <span class="rounded-full bg-blue-50 px-3 py-1 text-xs font-bold ${stockTone}">
                ${medicine.quantity <= 5 ? "Low stock" : "Available"}
              </span>
            </div>
            <div class="mt-6 space-y-2 text-slate-600">
              <p><span class="font-bold text-ink">Price:</span> Rs. ${medicine.price.toFixed(2)}</p>
              <p><span class="font-bold text-ink">Stock:</span> ${medicine.quantity} unit(s)</p>
            </div>
            <button
              class="mt-6 w-full rounded-xl bg-pine px-5 py-3 font-bold text-white shadow-soft transition hover:bg-pine/90"
              onclick='addToCart(${JSON.stringify(medicine)})'
            >
              Add to Cart
            </button>
          `;
          resultsDiv.appendChild(card);
        });
      }

      const paginationDiv = document.getElementById("pagination");
      paginationDiv.innerHTML = "";
      if (data.has_prev) {
        const prevBtn = document.createElement("button");
        prevBtn.className = "rounded-xl border border-slate-200 bg-white px-5 py-3 font-semibold text-pine";
        prevBtn.textContent = "Previous";
        prevBtn.onclick = () => searchMedicines(data.page - 1);
        paginationDiv.appendChild(prevBtn);
      }
      if (data.has_next) {
        const nextBtn = document.createElement("button");
        nextBtn.className = "rounded-xl bg-pine px-5 py-3 font-semibold text-white";
        nextBtn.textContent = "Next";
        nextBtn.onclick = () => searchMedicines(data.page + 1);
        paginationDiv.appendChild(nextBtn);
      }
    } catch (error) {
      showToast("Search failed: " + error.message, "error");
    } finally {
      searchBtnText.classList.remove("hidden");
      searchSpinner.style.display = "none";
    }
  }

  document.getElementById("search-form").addEventListener("submit", (event) => {
    event.preventDefault();
    searchMedicines();
  });
</script>
{% endblock %}
