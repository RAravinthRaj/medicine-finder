{% extends "base.html" %}

{% block title %}Medicine Finder - Signup{% endblock %}

{% block content %}
<section class="grid gap-8 lg:grid-cols-[1fr_1fr] lg:items-center">
  <div class="animate-rise">
    <p class="text-sm font-semibold uppercase tracking-[0.2em] text-pine">Get started</p>
    <h1 class="mt-4 text-5xl font-extrabold leading-tight tracking-tight text-ink">Create an account.</h1>
  </div>

  <div class="animate-rise mx-auto w-full max-w-xl rounded-3xl border border-slate-200 bg-white p-8 shadow-soft">
    <div class="mb-8">
      <p class="text-sm font-semibold uppercase tracking-[0.12em] text-slate-500">New account</p>
      <h2 class="mt-3 text-3xl font-bold text-ink">Signup</h2>
    </div>
    <form method="POST" class="space-y-5">
      <div>
        <label for="email" class="mb-2 block text-sm font-bold uppercase tracking-[0.12em] text-slate-500">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          class="w-full rounded-xl border border-slate-200 bg-white px-4 py-4 text-base outline-none transition focus:border-pine focus:ring-4 focus:ring-blue-100"
        />
      </div>
      <div>
        <label for="password" class="mb-2 block text-sm font-bold uppercase tracking-[0.12em] text-slate-500">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          class="w-full rounded-xl border border-slate-200 bg-white px-4 py-4 text-base outline-none transition focus:border-pine focus:ring-4 focus:ring-blue-100"
        />
      </div>
      <button
        type="submit"
        class="w-full rounded-xl bg-pine px-6 py-4 font-bold text-white shadow-soft transition hover:bg-pine/90"
      >
        Create Account
      </button>
    </form>
    <p class="mt-6 text-sm text-slate-600">
      Already registered? <a href="{{ url_for('auth.login') }}" class="font-bold text-pine hover:text-pine/80">Login here</a>
    </p>
  </div>
</section>
{% endblock %}
