{% extends "base.html" %}

{% block title %}Medicine Finder - Admin{% endblock %}

{% block content %}
<section class="animate-rise">
  <div class="mb-8">
    <p class="text-sm font-semibold uppercase tracking-[0.2em] text-pine">Admin</p>
    <h1 class="mt-3 text-5xl font-extrabold tracking-tight text-ink">Manage medicines.</h1>
  </div>

  <div class="grid gap-6 xl:grid-cols-[0.75fr_1.25fr]">
    <div class="space-y-6">
      <div class="glass-panel rounded-[2rem] border border-white/70 p-7 shadow-soft">
      <p class="text-sm font-semibold uppercase tracking-[0.3em] text-pine/45">Add medicine</p>
      <h2 class="mt-3 text-3xl font-bold text-ink">Add medicine</h2>
      <form method="POST" class="mt-6 space-y-4">
        <input type="hidden" name="action" value="add" />
        <div>
          <label for="name" class="mb-2 block text-sm font-bold uppercase tracking-[0.2em] text-pine/55">Name</label>
          <input type="text" id="name" name="name" required class="w-full rounded-2xl border border-pine/10 bg-white px-4 py-4 outline-none transition focus:border-teal focus:ring-4 focus:ring-teal/10" />
        </div>
        <div>
          <label for="quantity" class="mb-2 block text-sm font-bold uppercase tracking-[0.2em] text-pine/55">Quantity</label>
          <input type="number" id="quantity" name="quantity" required min="0" class="w-full rounded-2xl border border-pine/10 bg-white px-4 py-4 outline-none transition focus:border-teal focus:ring-4 focus:ring-teal/10" />
        </div>
        <div>
          <label for="price" class="mb-2 block text-sm font-bold uppercase tracking-[0.2em] text-pine/55">Price</label>
          <input type="number" id="price" name="price" required min="0" step="0.01" class="w-full rounded-2xl border border-pine/10 bg-white px-4 py-4 outline-none transition focus:border-teal focus:ring-4 focus:ring-teal/10" />
        </div>
        <button type="submit" class="w-full rounded-full bg-pine px-6 py-4 font-bold text-white shadow-soft transition hover:bg-pine/90">
          Add Medicine
        </button>
      </form>
      </div>

      <div class="glass-panel rounded-[2rem] border border-white/70 p-7 shadow-soft">
        <p class="text-sm font-semibold uppercase tracking-[0.3em] text-pine/45">Scraping</p>
        <h2 class="mt-3 text-3xl font-bold text-ink">Import data</h2>
        <form method="POST" class="mt-6 space-y-4">
          <input type="hidden" name="action" value="scrape_url" />
          <div>
            <label for="source_url" class="mb-2 block text-sm font-bold uppercase tracking-[0.2em] text-pine/55">Source URL</label>
            <input type="text" id="source_url" name="source_url" placeholder="https://example.com/medicines" class="w-full rounded-2xl border border-pine/10 bg-white px-4 py-4 outline-none transition focus:border-teal focus:ring-4 focus:ring-teal/10" />
          </div>
          <button type="submit" class="w-full rounded-full border border-pine/10 bg-white px-6 py-4 font-bold text-pine shadow-soft transition hover:bg-pine/5">
            Scrape URL
          </button>
        </form>
        <form method="POST" class="mt-4">
          <input type="hidden" name="action" value="scrape_sample" />
          <button type="submit" class="w-full rounded-full bg-pine px-6 py-4 font-bold text-white shadow-soft transition hover:bg-pine/90">
            Import Sample Source
          </button>
        </form>
      </div>

      <div class="glass-panel rounded-[2rem] border border-white/70 p-7 shadow-soft">
        <p class="text-sm font-semibold uppercase tracking-[0.3em] text-pine/45">Knowledge</p>
        <h2 class="mt-3 text-3xl font-bold text-ink">Vector index</h2>
        <form method="POST" class="mt-6">
          <input type="hidden" name="action" value="reindex_knowledge" />
          <button type="submit" class="w-full rounded-full border border-pine/10 bg-white px-6 py-4 font-bold text-pine shadow-soft transition hover:bg-pine/5">
            Rebuild Embeddings
          </button>
        </form>
      </div>
    </div>

    <div class="space-y-5">
      <div class="glass-panel rounded-[2rem] border border-white/70 p-7 shadow-soft">
        <p class="text-sm font-semibold uppercase tracking-[0.3em] text-pine/45">Manage medicines</p>
        <h2 class="mt-3 text-3xl font-bold text-ink">Catalog</h2>
      </div>

      {% for medicine in medicines %}
      <div class="glass-panel rounded-[2rem] border border-white/70 p-6 shadow-soft">
        <form method="POST" class="grid gap-4 lg:grid-cols-3">
          <input type="hidden" name="action" value="edit" />
          <input type="hidden" name="id" value="{{ medicine.id }}" />
          <div>
            <label for="name-{{ medicine.id }}" class="mb-2 block text-sm font-bold uppercase tracking-[0.2em] text-pine/55">Name</label>
            <input type="text" id="name-{{ medicine.id }}" name="name" value="{{ medicine.name }}" required class="w-full rounded-2xl border border-pine/10 bg-white px-4 py-4 outline-none transition focus:border-teal focus:ring-4 focus:ring-teal/10" />
          </div>
          <div>
            <label for="quantity-{{ medicine.id }}" class="mb-2 block text-sm font-bold uppercase tracking-[0.2em] text-pine/55">Quantity</label>
            <input type="number" id="quantity-{{ medicine.id }}" name="quantity" value="{{ medicine.quantity }}" required min="0" class="w-full rounded-2xl border border-pine/10 bg-white px-4 py-4 outline-none transition focus:border-teal focus:ring-4 focus:ring-teal/10" />
          </div>
          <div>
            <label for="price-{{ medicine.id }}" class="mb-2 block text-sm font-bold uppercase tracking-[0.2em] text-pine/55">Price</label>
            <input type="number" id="price-{{ medicine.id }}" name="price" value="{{ medicine.price }}" required min="0" step="0.01" class="w-full rounded-2xl border border-pine/10 bg-white px-4 py-4 outline-none transition focus:border-teal focus:ring-4 focus:ring-teal/10" />
          </div>
          <div class="flex flex-col gap-3 sm:flex-row lg:col-span-3">
            <button type="submit" class="rounded-full bg-pine px-5 py-3 font-bold text-white shadow-soft transition hover:bg-pine/90">
              Update
            </button>
            <button
              type="submit"
              formaction="{{ url_for('medicine.admin') }}"
              formmethod="POST"
              name="action"
              value="delete"
              class="rounded-full border border-coral/20 bg-white px-5 py-3 font-bold text-coral transition hover:bg-coral hover:text-white"
            >
              Delete
            </button>
          </div>
        </form>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
